title: Tentative d'injection SQL dans une URL
id: WEB-001
status: experimental
description: Motif d'injection SQL detecte dans le chemin ou la query string d'une requete HTTP.
author: SOC-AI
logsource:
  category: webserver
detection:
  selection:
    source_type: web
    path_decoded|re: "(union\\s+select|or\\s+1\\s*=\\s*1|'\\s*or\\s*'|sleep\\(|benchmark\\(|information_schema|xp_cmdshell|--\\s|;\\s*drop\\s+table)"
  condition: selection
falsepositives:
  - Scanner de vulnerabilite autorise
  - Documentation technique contenant des exemples SQL
level: high
tags:
  - attack.initial_access
  - attack.t1190
