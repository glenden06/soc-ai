title: Escalade de privileges Windows
id: WIN-001
status: experimental
description: Event 4672, des privileges speciaux ont ete assignes a une nouvelle session d'ouverture.
author: SOC-AI
logsource:
  product: windows
  service: security
detection:
  selection:
    source_type: windows
    event_id: '4672'
  filter_system:
    user|contains:
      - SYSTEM
      - LOCAL SERVICE
      - NETWORK SERVICE
  condition: selection and not filter_system
falsepositives:
  - Comptes de service applicatifs legitimes
level: critical
tags:
  - attack.privilege_escalation
  - attack.t1078
