name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dependances
        run: |
          pip install -r parser/requirements.txt
          pip install -r engine/requirements.txt
          pip install -r llm_agent/requirements.txt
          pip install -r api/requirements.txt
          pip install pytest httpx
      - run: python -m pytest tests/ -v

  end-to-end:
    name: Pipeline de bout en bout
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml requests
      - name: Ingerer, detecter, trier
        env:
          SOCAI_DB: /tmp/socai-ci.db
        run: |
          python parser/parser.py --dir samples --once
          python engine/engine.py --once
          python llm_agent/agent.py --once
          python - <<'PY'
          import os, sqlite3, sys
          conn = sqlite3.connect(os.environ["SOCAI_DB"])
          rules = {row[0] for row in conn.execute("SELECT DISTINCT rule_id FROM alerts")}
          pending = conn.execute("SELECT COUNT(*) FROM alerts WHERE triage_status != 'triaged'").fetchone()[0]
          expected = {"SSH-001", "SSH-002", "SSH-003", "WEB-001", "WEB-002",
                      "WEB-003", "WIN-001", "WIN-002", "WIN-003", "NET-001"}
          missing = expected - rules
          if missing:
              sys.exit(f"regles non declenchees sur le jeu de demonstration : {sorted(missing)}")
          if pending:
              sys.exit(f"{pending} alertes non triees")
          print(f"OK : {len(rules)} regles declenchees, toutes les alertes triees")
          PY

  build:
    name: Build des images
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Construire les images Docker
        run: docker compose build
